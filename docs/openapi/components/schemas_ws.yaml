#SERVER TO CLIENT
WS-StoC-FriendChat:
  type: object
  description: Websocket object for recieved data from the server about all friend chats requests
  properties:
    target: { type: string, fromat: "friend-chat"}
    event: 
      type: string
      fromat: "update_status | new"
      descripion: "update_status: change the current status of the target message (targeted by uid) | new: Notif client there is a new message inbond"
    message:
      $ref: ../openapi.yaml#/components/schemas/Message

WS-StoC-Notif:
  type: object
  description: Websocket object for recieved data from the server about all notifications requests
  properties:
    target: { type: string, fromat: "notif"}
    event: 
      type: string
      fromat: "new"
      descripion: "new: Notif client there is a new notification inbond"
    notif:
      oneOf:
       - $ref: ../openapi.yaml#/components/schemas/Notif - Requests
       - $ref: ../openapi.yaml#/components/schemas/Notif - Accepted

WS-StoC-FriendRequests:
  type: object
  description: Websocket object for recieved data from the server about all friend requests (used for live update)
  properties:
    target: { type: string, fromat: "friend-request"}
    event: 
      type: string
      fromat: "new-incoming"
      descripion: "new-incoming: Client recieved a new friend requests"
    user:
      $ref: ../openapi.yaml#/components/schemas/ExtUserInfo

      

WS-StoC-Game:
  type: object
  description: Websocket payloads sent by the server for game flow.
  properties:
    target:
      type: string
      fromat: "player-join | player-leave | players-update | message-new | message-update"
      descripion: "[player-join]: notify the user a player has joined the game room | \
        [player-leave]: notify the user a player has leaved the game room | \
        [players-update]: ask to user to update players list using given list | \
        [message-new]: notify user a new message has been sent | \
        [message-update]: ask to user to update chat list using given list"
    gameid (all): {type: string, descripion: "Current game ID required by any ws about the game"}
    gameuid (all): {type: string, descripion: "Current game UID required by any ws about the game"}
    player (player-join - player-leave):
      $ref: /components/schemas_game.yaml#/GamePlayer
    players (players-update):
      type: array
      items:
        $ref: /components/schemas_game.yaml#/GamePlayer
    message (message-new):
      $ref: /components/schemas_game.yaml#/GameChat
    messages (message-update):
      type: array
      items:
        $ref: /components/schemas_game.yaml#/GameChat



#CLIENT TO SERVER
WS-CtoS-FriendChat:
  type: object
  description: Websocket object for send data to the server about all friend chats requests
  properties:
    target: { type: string, fromat: "friend-chat"}
    event: 
      type: string
      fromat: "send | open | close"
      descripion: "send: notify server there is a message sent by user |\
        open: Notify server a chat has been opened with targeted user |\
        close: Notify server a chat hjas been closed with targeted user"
    message (send):
      $ref: /components/schemas_social.yaml#/Message
    to (open | close):
      type: string
      descripion: "Name of the target user"
    toUid (open | close):
      type: string
      descripion: "uid of the target user0"

WS-CtoS-Game:
  type: object
  description: Websocket payloads sent by the client to control a game session.
  properties:
    target:
      type: string
      fromat: "join | message-send"
      descripion: "[join]: notify server user has joined the game | \
        [message-send]: event when user is send a message"
    gameid (all): {type: string, descripion: "Current game ID required by any ws about the game"}
    gameuid (all): {type: string, descripion: "Current game UID required by any ws about the game"}
    message (message-send): {type: string, descripion: "Sent message by the user"}