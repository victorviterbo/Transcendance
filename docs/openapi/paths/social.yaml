friends-list:
  get:
    summary: List accepted friends
    operationId: listFriends
    tags: [social]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Accepted friends.
        content:
          application/json:
            schema:
              type: object
              required: [friends]
              properties:
                friends:
                  type: array
                  items: { $ref: ../openapi.yaml#/components/schemas/FriendInfo }
      "401": { description: Authentication required. }

friends-search:
  post:
    summary: Search registered profiles by username substring
    operationId: searchFriends
    tags: [social]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [search]
            properties:
              search: { type: string, minLength: 1, maxLength: 20 }
    responses:
      "200":
        description: Matching profiles excluding the current user.
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items: { $ref: ../openapi.yaml#/components/schemas/ExtUserInfo }
      "400": { description: Missing, empty, or overlong search value. }
      "401": { description: Authentication required. }

friends-requests:
  get:
    summary: List pending incoming and outgoing friend requests
    operationId: listFriendRequests
    tags: [social]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Pending request lists.
        content:
          application/json:
            schema:
              type: object
              required: [incoming, outgoing]
              properties:
                incoming: { type: array, items: { $ref: ../openapi.yaml#/components/schemas/ExtUserInfo } }
                outgoing: { type: array, items: { $ref: ../openapi.yaml#/components/schemas/ExtUserInfo } }
      "401": { description: Authentication required. }

friends-requests-send:
  post:
    summary: Send a friend request
    operationId: sendFriendRequest
    tags: [social]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../openapi.yaml#/components/schemas/FriendTargetRequest }
    responses:
      "201":
        description: Request created.
        content: { application/json: { schema: { $ref: ../openapi.yaml#/components/schemas/FriendActionResponse } } }
      "400": { description: Missing/unknown target, self-request, or existing relationship. }
      "401": { description: Authentication required. }

friends-requests-respond:
  post:
    summary: Accept or refuse an incoming pending request
    operationId: respondFriendRequest
    tags: [social]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - { $ref: ../openapi.yaml#/components/schemas/FriendTargetRequest }
              - type: object
                required: [newStatus]
                properties:
                  newStatus: { type: string, enum: [accept, refuse, reject] }
    responses:
      "200":
        description: Request accepted or refused (`reject` is normalized to `refuse`).
        content: { application/json: { schema: { $ref: ../openapi.yaml#/components/schemas/FriendActionResponse } } }
      "400": { description: Missing/unknown target, invalid status, or no applicable pending request. }
      "401": { description: Authentication required. }

friend-remove:
  post:
    summary: Remove a friend or cancel an outgoing request
    operationId: removeFriend
    tags: [social]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../openapi.yaml#/components/schemas/FriendTargetRequest }
    responses:
      "200":
        description: Friendship removed or outgoing request cancelled.
        content: { application/json: { schema: { $ref: ../openapi.yaml#/components/schemas/FriendActionResponse } } }
      "400": { description: Missing/unknown target or no removable relationship. }
      "401": { description: Authentication required. }

social-message:
  post:
    summary: Get direct-message history with a friend
    operationId: getFriendMessageFeed
    tags: [social]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Backend accepts `uid`, `user_uid`, or `targetUid`; the frontend sends `uid`.
            properties:
              uid: { type: string, format: uuid }
              user_uid: { type: string, format: uuid }
              targetUid: { type: string, format: uuid }
            anyOf: [{ required: [uid] }, { required: [user_uid] }, { required: [targetUid] }]
    responses:
      "200":
        description: Chronological direct-message feed, or an empty feed if no room exists.
        content:
          application/json:
            schema:
              type: object
              required: [feed]
              properties:
                feed: { type: array, items: { $ref: ../openapi.yaml#/components/schemas/Message } }
      "400": { description: Missing/unknown target or self-DM. }
      "403": { description: Target is not an accepted friend. }
      "401": { description: Authentication required. }

notif:
  get:
    summary: List pending-request and accepted-request notifications
    operationId: listNotifications
    tags: [social]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Notifications sorted newest first.
        content:
          application/json:
            schema:
              type: object
              required: [notifs]
              properties:
                notifs:
                  type: array
                  items:
                    oneOf:
                      - { $ref: ../openapi.yaml#/components/schemas/NotifRequests }
                      - { $ref: ../openapi.yaml#/components/schemas/NotifAccepted }
      "401": { description: Authentication required. }

notif-read:
  post:
    summary: Mark all current social notifications as read
    operationId: markNotificationsRead
    tags: [social]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Read flags updated.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      "401": { description: Authentication required. }
