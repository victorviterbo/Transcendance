  schemas:
    FriendChatSendPayload:
      type: object
      additionalProperties: false
      required: [target, event, message]
      properties:
        target:
          const: friend_chat
        event:
          const: send
        message:
          $ref: "#/components/schemas/ClientOutgoingMessage"

    FriendChatOpenPayload:
      type: object
      additionalProperties: false
      required: [target, event, toUid]
      properties:
        target:
          const: friend_chat
        event:
          const: open
        toUid:
          type: string
          format: uuid
          description: Profile UID of the selected friend.
        to:
          type: string
          description: Selected friend's display name; not used for backend lookup.

    FriendChatClosePayload:
      type: object
      additionalProperties: false
      required: [target, event, toUid]
      properties:
        target:
          const: friend_chat
        event:
          const: close
        toUid:
          type: string
          format: uuid
          description: Profile UID of the selected friend.
        to:
          type: string
          description: Selected friend's display name; not used for backend lookup.

    FriendChatNewPayload:
      type: object
      additionalProperties: false
      required: [target, event, message]
      properties:
        target:
          const: friend_chat
        event:
          const: new
        message:
          oneOf:
            - $ref: "#/components/schemas/ServerOutgoingMessage"
            - $ref: "#/components/schemas/ServerIncomingMessage"

    FriendChatStatusUpdatedPayload:
      type: object
      additionalProperties: false
      required: [target, event, message]
      properties:
        target:
          const: friend_chat
        event:
          const: update_status
        message:
          oneOf:
            - $ref: "#/components/schemas/ServerOutgoingMessage"
            - $ref: "#/components/schemas/MessageStatusPatch"

    ClientOutgoingMessage:
      type: object
      additionalProperties: false
      required: [message, targetUid]
      description: |
        The backend consumes `message` and `targetUid`. The remaining fields are
        optimistic UI metadata currently sent by the frontend.
      properties:
        message:
          type: string
          maxLength: 500
          minLength: 1
        targetUid:
          type: string
          format: uuid
          description: Profile UID of the friend receiving the message.
        date:
          type: string
          format: date-time
        direction:
          const: outgoing
        status:
          const: not-sent
        target:
          type: string
        uid:
          type: string

    MessageCommon:
      type: object
      required: [message, date, direction, targetUid, target, uid]
      properties:
        message:
          type: string
        date:
          type: string
          format: date-time
        direction:
          enum: [outgoing, incoming]
        targetUid:
          type: string
          format: uuid
          description: Profile UID of the other participant.
        target:
          type: string
          description: Username of the other participant.
        uid:
          type: string
          format: uuid

    ServerOutgoingMessage:
      allOf:
        - $ref: "#/components/schemas/MessageCommon"
        - type: object
          required: [status]
          properties:
            direction:
              const: outgoing
            status:
              enum: [sent, recieved, read]
              description: |
                Delivery state. `recieved` is intentionally spelled as in the
                current frontend/backend contract.

    MessageStatusPatch:
      type: object
      additionalProperties: false
      required: [uid, status]
      properties:
        uid:
          type: string
          format: uuid
        status:
          enum: [sent, recieved, read]
          description: "`recieved` is intentionally spelled as implemented."

    ServerIncomingMessage:
      allOf:
        - $ref: "#/components/schemas/MessageCommon"
        - type: object
          properties:
            direction:
              const: incoming

    FriendRequestIncomingPayload:
      type: object
      additionalProperties: false
      required: [target, event, user]
      properties:
        target:
          const: friend_request
        event:
          const: new_incoming
        user:
          $ref: "#/components/schemas/IncomingRequestUser"

    NotificationNewPayload:
      type: object
      additionalProperties: false
      required: [target, event, notif]
      properties:
        target:
          const: notif
        event:
          const: new
        notif:
          oneOf:
            - $ref: "#/components/schemas/FriendRequestNotification"
            - $ref: "#/components/schemas/FriendAcceptedNotification"

    CommandErrorPayload:
      type: object
      required: [type, message]
      properties:
        type: { const: error }
        message: { type: string }

    FriendRequestNotification:
      type: object
      additionalProperties: false
      required: [uid, kind, from, date, read]
      properties:
        uid:
          type: string
          format: uuid
          description: Friendship UID.
        kind:
          const: friend_request
        from:
          $ref: "#/components/schemas/IncomingRequestUser"
        date:
          type: string
          format: date-time
        read:
          type: boolean

    FriendAcceptedNotification:
      type: object
      additionalProperties: false
      required: [uid, kind, from, date, read]
      properties:
        uid:
          type: string
          format: uuid
          description: Friendship UID.
        kind:
          const: friend_accepted
        from:
          $ref: "#/components/schemas/AcceptedRequestUser"
        date:
          type: string
          format: date-time
        read:
          type: boolean

    ExternalUser:
      type: object
      additionalProperties: false
      required: [uid, username, avatar, badges, relation]
      properties:
        uid:
          type: string
          format: uuid
        username:
          type: string
        avatar:
          type: string
          format: uri-reference
        badges:
          type: string
        relation:
          enum: [not-friends, friends, incoming, outgoing]

    IncomingRequestUser:
      allOf:
        - $ref: "#/components/schemas/ExternalUser"
        - type: object
          properties:
            relation:
              const: incoming

    AcceptedRequestUser:
      allOf:
        - $ref: "#/components/schemas/ExternalUser"
        - type: object
          properties:
            relation:
              const: friends

    GameJoinPayload:
      type: object
      additionalProperties: false
      required: [target, event, uid]
      properties:
        target:
          const: game
        event:
          const: player_join
        uid:
          type: string
          format: uuid
          description: Game UID.

    GameStartPayload:
      type: object
      required: [target, event, uid]
      properties:
        target:
          const: game
        event:
          const: game_start
        uid:
          type: string
          format: uuid
          description: Game UID.

    GameRestartPayload:
      type: object
      required: [target, event, uid]
      properties:
        target: { const: game }
        event: { const: game_restart }
        uid: { type: string, format: uuid }

    GameUpdateSettingsPayload:
      type: object
      required: [target, event, uid, settings]
      properties:
        target:
          const: game
        event:
          const: settings_update
        uid:
          type: string
          format: uuid
          description: Game UID.
        settings:
          $ref: "#/components/schemas/GameSettings"

    GameSubmitAnswerPayload:
      type: object
      required: [target, event, uid, answer, time]
      properties:
        target:
          const: game
        event:
          const: answer_submit
        uid:
          type: string
          format: uuid
          description: Game UID.
        answer:
          type: string
        time:
          type: number

    GameMessageSendPayload:
      type: object
      required: [target, event, uid, message]
      properties:
        target:
          const: game
        event:
          const: message_send
        uid:
          type: string
          format: uuid
          description: Game UID.
        message:
          type: string
          maxLength: 500

    GameLeavePayload:
      type: object
      required: [target, event, uid]
      properties:
        target:
          const: game
        event:
          const: player_leave
        uid:
          type: string
          format: uuid
          description: Game UID.

    GameProfile:
      type: object
      required: [username, avatar, guest, uid]
      properties:
        username:
          type: string
        avatar:
          type: string
          format: uri-reference
        guest:
          type: boolean
        uid:
          type: string
          format: uuid

    GameReceiveHeader:
      type: object
      required: [uid]
      properties:
        uid:
          type: string
          format: uuid
          description: Game UID.

    GameSendHeader:
      type: object
      required: [uid, self]
      properties:
        uid:
          type: string
          format: uuid
          description: Game UID.
        self:
          $ref: "#/components/schemas/PlayerInfo"
          description: Player receiving this message.

    GamePlayerJoinedPayload:
      $ref: "#/components/schemas/GamePlayerJoinedBroadcastPayload"

    GameInfoPayload:
      type: object
      required: [target, event, uid, self, game, settings, leaderboard, history]
      properties:
        target:
          const: game
        event:
          const: game_info
        uid:
          type: string
          format: uuid
          description: Game UID.
        self:
          $ref: "#/components/schemas/PlayerInfo"
        game:
          $ref: "#/components/schemas/GameInfo"
        settings:
          $ref: "#/components/schemas/GameSettings"
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        history:
          $ref: "#/components/schemas/History"

    GameInfo:
      type: object
      additionalProperties: false
      required: [uid, name, owner, status, round, genres, visibility, maxPlayers]
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        owner:
          $ref: "#/components/schemas/PlayerInfo"
        status:
          enum: [waiting, playing_round, playing_break, finished, aborted]
        round:
          type: integer
          minimum: 0
        genres:
          type: array
          items:
            enum: [TAG_POP, TAG_RAP, TAG_ROCK, TAG_ELECTRO, TAG_FRENCH_VARIETY, TAG_RNB]
        visibility:
          enum: [public, friends, private]
        maxPlayers:
          type: integer

    GameSettings:
      type: object
      additionalProperties: false
      required:
        [
          genres,
          mode,
          trackCount,
          playbackDuration,
          breakDuration,
          reveal,
          fuzzy,
        ]
      properties:
        genres:
          type: array
          items:
            enum:
              [
                TAG_POP,
                TAG_RAP,
                TAG_ROCK,
                TAG_ELECTRO,
                TAG_FRENCH_VARIETY,
                TAG_RNB,
              ]
        mode:
          enum: [normal, speed]
        trackCount:
          type: integer
          minimum: 1
          maximum: 100
        playbackDuration:
          type: number
          minimum: 5
          maximum: 30
        breakDuration:
          type: number
          minimum: 5
          maximum: 30
        reveal:
          type: boolean
        fuzzy:
          type: boolean

    PlayerInfo:
      type: object
      additionalProperties: false
      required: [username, avatar, guest, uid]
      properties:
        username:
          type: string
        avatar:
          type: string
          format: uri-reference
        guest:
          type: boolean
        uid:
          type: string
          format: uuid

    GameChatMessage:
      type: object
      additionalProperties: false
      required: [uid, sender, body]
      properties:
        uid:
          type: string
          format: uuid
        sender:
          $ref: "#/components/schemas/PlayerInfo"
        body:
          type: string
          maxLength: 500

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [player, points]
      properties:
        player:
          $ref: "#/components/schemas/PlayerInfo"
        points:
          type: number

    TrackInfo:
      type: object
      additionalProperties: false
      required: [title, artist, preview, artwork]
      properties:
        title:
          type: string
        artist:
          type: string
        preview:
          type: string
          format: uri
        artwork:
          type: string
          format: uri

    RoundResult:
