  patch:
    summary: Partially update a game
    description: Update mutable fields of a game
    operationId: patchGame
    tags: [game]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              game_name:
                type: string
                description: Game name (read-only in backend, included for clarity)
                readOnly: true
              genres:
                type: array
                items:
                  type: string
                description: Genre list to use for rounds
              game_mode:
                type: string
                enum: [normal, speed, armageddon]
                description: Gameplay mode
              public_level:
                type: string
                enum: [public, friends, private]
                description: New privacy level (public/friends/private)
              trackCount:
                type: integer
                minimum: 1
                maximum: 100
                description: Number of tracks in the game
              breakDuration:
                type: integer
                minimum: 1
                description: Break duration between rounds (seconds)
              playbackDuration:
                type: integer
                minimum: 5
                maximum: 30
                description: Track preview duration (seconds)
              fuzzy:
                type: boolean
                description: Enable fuzzy answer matching
              answer_public:
                type: boolean
                description: Whether answers are visible to all players
          examples:
            privacy_only:
              summary: Update only privacy
              value:
                public_level: "private"
            speed_competitive:
              summary: Competitive speed setup
              value:
                genres: ["rock", "electro", "rap"]
                game_mode: "speed"
                public_level: "friends"
                trackCount: 20
                breakDuration: 8
                playbackDuration: 12
                fuzzy: false
                answer_public: true
            chill_long_session:
              summary: Relaxed long session
              value:
                genres: ["pop", "r&b/soul", "variété française"]
                game_mode: "normal"
                public_level: "public"
                trackCount: 30
                breakDuration: 20
                playbackDuration: 25
                fuzzy: true
                answer_public: false
    responses:
      "200":
        description: Game updated
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/GameCreationResponse
            examples:
              updated_42:
                value:
                  success: true
                  game_id: 42
              updated_87:
                value:
                  success: true
                  game_id: 87
              updated_133:
                value:
                  success: true
                  game_id: 133
      "400":
        description: Validation error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
            examples:
              invalid_playback:
                value:
                  error:
                    playbackDuration: "MAX_VALUE_PLAYBACKDURATION"
              invalid_genres:
                value:
                  error:
                    genres: "INVALID_GENRES"
              invalid_tracks:
                value:
                  error:
                    trackCount: "MIN_VALUE_TRACKCOUNT"

  delete:
    summary: Delete a game
    description: Remove a game resource
    operationId: deleteGame
    tags: [game]
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Game deleted
      "404":
        description: Game not found
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
            examples:
              not_found_uuid:
                value:
                  error: "GAME_NOT_FOUND"
              already_deleted:
                value:
                  error: "GAME_ALREADY_DELETED"
              room_mismatch:
                value:
                  error: "ROOMID_NOT_FOUND"

