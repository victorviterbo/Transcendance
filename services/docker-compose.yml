services:
  backend:
    container_name: backend
    image: transcendence-backend
    build:
      context: ./backend
      dockerfile: build/Dockerfile
    volumes:
      - ./backend/:/backend/
    expose:
      - "8000"
    env_file: ./backend/.env
    environment:
      - APP_MODE=${MODE:-run}
      - PYTHONUNBUFFERED=1

  nginx:
    container_name: nginx
    image: transcendence-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./backend/DB/media:/backend-media
      - ./backend/DB/static:/backend-static
    depends_on:
      - backend
