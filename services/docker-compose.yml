services:
  database:
    container_name: database
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - database-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: backend
    image: transcendence-backend
    build:
      context: .
      dockerfile: backend/build/Dockerfile
    volumes:
      - backend-media:/data/media
    expose:
      - "8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/opt/conda/envs/backend/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    container_name: nginx
    image: transcendence-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend-media:/data/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database-data:
  backend-media:
