game:
  get:
    summary: List waiting public games with active players
    operationId: listPublicGames
    tags: [game]
    responses:
      "200":
        description: Waiting public games that currently have at least one active player. Empty rooms are omitted.
        content:
          application/json:
            schema: { $ref: ../openapi.yaml#/components/schemas/GameListResponse }
  post:
    summary: Create a game
    description: Uses the authenticated or guest profile injected into the request.
    operationId: createGame
    tags: [game]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../openapi.yaml#/components/schemas/GameCreationRequest }
    responses:
      "201":
        description: Created game, including its initially empty player list.
        content:
          application/json:
            schema: { $ref: ../openapi.yaml#/components/schemas/GameDetail }
      "400": { description: No request profile or invalid name/visibility. }

game-friends-list:
  get:
    summary: List waiting non-private games owned by accepted friends with active players
    operationId: listFriendGames
    tags: [game]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Friends' waiting games that currently have at least one active player. Empty rooms are omitted.
        content:
          application/json:
            schema: { $ref: ../openapi.yaml#/components/schemas/GameListResponse }
      "401": { description: Authentication required. }

game-common:
  parameters:
    - in: path
      name: uid
      required: true
      schema: { type: string, format: uuid }
  get:
    summary: Get a game by UID
    operationId: getGame
    tags: [game]
    responses:
      "200":
        description: Serialized game detail.
        content:
          application/json:
            schema: { $ref: ../openapi.yaml#/components/schemas/GameDetail }
      "404": { description: Game not found. }
