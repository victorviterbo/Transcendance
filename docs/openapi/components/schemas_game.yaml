#GLOBAL
GameData:
  type: object
  description:  All data about the current game
  properties:
    id: { type: string, descripion: "Current game / room id"}
    maxPlayers: { type: int, descripion: "Maximum allowed player in that game"}
    players: 
      type: array
      items:
        $ref: "../openapi.yaml#/components/schemas/Game - GamePlayer"

GamePlayer:
  type: object
  description:  Data about one of the player in the game
  properties:
    user:
      $ref: ../openapi.yaml#/components/schemas/ExtUserInfo
    points: { type: int, descripion: "Current player points"}

GameCreationRequest:
  type: object
  description: Request body for creating a new game
  required:
    - game_name
    - public_level
  properties:
    game_name:
      type: string
      description: Name of the game (required)
    genres:
      type: array
      items:
        type: string
      description: List of music genres for the game (optional)
    game_mode:
      type: string
      description: Game mode (optional)
    public_level:
      type: string
      description: Privacy level of the game (required) - public, friends_only, or invite_only
    num_tracks:
      type: integer
      minimum: 1
      maximum: 100
      description: Number of tracks to include in the game (optional)
    break_duration:
      type: integer
      description: Duration of break between rounds in seconds (optional)
    playback_duration:
      type: integer
      minimum: 5
      maximum: 30
      description: Duration for track playback in seconds (optional)
    fuzzy_match:
      type: boolean
      description: Whether to enable fuzzy matching for answers (optional)
    answer_public:
      type: boolean
      description: Whether answers should be public (optional)

GameCreationResponse:
  type: object
  description: Response for game creation
  properties:
    success:
      type: boolean
      description: Whether the game was created successfully
    game_id:
      type: integer
      description: ID of the newly created game