WS-friend-chat:
  post:
    summary: WS about all friend chat
    description: Websocket object for recieved data from the server about all friend chats requests
    operationId: WSStoCFriendChat
    tags: [websockets]
    requestBody:
      required: true
      content:
        send:
          schema:
            $ref: ../openapi.yaml#/components/schemas/WS - CtoS - friend-chat
          examples:
            list:
              value:
                target: "friend-chat"
                event: "send"
                message:
                  message: "Hey !!!"
                  date: "2026-04-26T10:33:49.316Z"
                  direction: "outgoing"
                  status: "read"
                  target-id: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                  target: "alice"
                  uid: "TEMP_ID"
        open:
          schema:
            $ref: ../openapi.yaml#/components/schemas/WS - CtoS - friend-chat
          examples:
            list:
              value:
                target: "friend-chat"
                event: "open"
                toUid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                to: "alice"
        close:
          schema:
            $ref: ../openapi.yaml#/components/schemas/WS - CtoS - friend-chat
          examples:
            list:
              value:
                target: "friend-chat"
                event: "close"
                toUid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                to: "alice"
    responses:
      "200":
        content:
          json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WS - StoC - friend-chat
            examples:
              new:
                value:
                  target: "friend-chat"
                  event: "new"
                  message:
                    message: "Hey !!!"
                    date: "2026-04-26T10:33:49.316Z"
                    direction: "outgoing"
                    status: "sent"
                    target-id: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                    target: "alice"
                    uid: "57092788-491a-484c-a162-b67657584fa5"
              update_status:
                value:
                  target: "friend-chat"
                  event: "update_status"
                  message:
                    message: "Hey !!!"
                    date: "2026-04-26T10:33:49.316Z"
                    direction: "outgoing"
                    status: "read"
                    target-id: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                    target: "alice"
                    uid: "57092788-491a-484c-a162-b67657584fa5"


WS-notif:
  post:
    summary: WS about all notifications
    description: Websocket object for recieved data from the server about all notifications requests
    operationId: WSStoCNotif
    tags: [websockets]
    responses:
      "200":
        content:
          json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WS - StoC - notif
            examples:
              new:
                value:
                  target: "notif"
                  event: "new"
                  notif:
                    uid: "57092788-491a-484c-a162-b67657584fa5"
                    kind: "friend-request"
                    from:
                      uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "alice"
                      image: "path/to/image"
                      badges: "deaf octopus"
                      relation: "incoming"
                    date: 2026-04-26T10:33:49.316Z"
                    read: false;

                    
WS-friend-request:
  post:
    summary: WS about all friend requests
    description: Websocket object for recieved data from the server about all friend requests (used for live update)
    operationId: WSStoCNotif
    tags: [websockets]
    responses:
      "200":
        content:
          json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WS - StoC - friend-request
            examples:
              new-incoming:
                value:
                  target: "friend-request"
                  event: "new-incoming"
                  user:
                    uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                    username: "alice"
                    image: "path/to/image"
                    badges: "deaf octopus"
                    relation: "incoming"


#====================== GAME ======================
WS-game:
  post:
    summary: WS about all game data
    description: Websocket object for game lifecycle and round events.
    operationId: WSStoCGame
    tags: [websockets]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/WS - CtoS - game
          examples:
            join_game:
              value:
                target: "game"
                event: "join_game"
                game_uid: "123456"
            start_game:
              value:
                target: "game"
                event: "start_game"
                game_uid: "123456"
            answer_submit:
              value:
                target: "game"
                event: "answer_submit"
                game_uid: "123456"
                answer: "My answer"
                answerTime: 1.42
            leave_game:
              value:
                target: "game"
                event: "leave_game"
                game_uid: "123456"
        
    responses:
      "200":
        content:
          json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WS - StoC - game
            examples:
              joined_game:
                value:
                  target: "game"
                  event: "joined_game"
                  game_uid: "123456"
              player_joined:
                value:
                  target: "game"
                  event: "player_joined"
                  game_uid: "123456"
                  player_uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                  player_name: "alice"
              game_started:
                value:
                  target: "game"
                  event: "game_started"
                  game_uid: "123456"
                  started_by: "alice"
              round_started:
                value:
                  target: "game"
                  event: "round_started"
                  game_uid: "123456"
                  round_number: 1
                  track:
                    preview_url: "https://example.com/preview.mp3"
              track_revealed:
                value:
                  target: "game"
                  event: "track_revealed"
                  game_uid: "123456"
                  track:
                    itunes_id: 123456
                    title: "Song title"
                    artist: "Artist name"
                    genre: "pop"
                    preview_url: "https://example.com/preview.mp3"
                    artwork_url: "https://example.com/artwork.jpg"
              round_end:
                value:
                  target: "game"
                  event: "round_end"
                  game_uid: "123456"
                  round_number: 1
                  next_round_in: 5
                  results:
                    correct_answer:
                      artist: "Artist name"
                      song: "Song title"
                    answers:
                      - player_uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                        player_name: "alice"
                        answer: "Song title"
                        is_correct: true
              answer_correct:
                value:
                  target: "game"
                  event: "answer_correct"
                  game_uid: "123456"
                  track:
                    itunes_id: 123456
                    title: "Song title"
                    artist: "Artist name"
                    genre: "pop"
                    preview_url: "https://example.com/preview.mp3"
                    artwork_url: "https://example.com/artwork.jpg"
              answer_incorrect:
                value:
                  target: "game"
                  event: "answer_incorrect"
                  message: "Wrong answer"
              player_answered:
                value:
                  target: "game"
                  event: "player_answered"
                  game_uid: "123456"
                  player_uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                  player_name: "alice"
              player_left:
                value:
                  target: "game"
                  event: "player_left"
                  game_uid: "123456"
                  player_uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                  player_name: "alice"
              round_advanced:
                value:
                  target: "game"
                  event: "round_advanced"
                  game_uid: "123456"
                  round_number: 2
              game_completed:
                value:
                  target: "game"
                  event: "game_completed"
                  game_uid: "123456"
              error:
                value:
                  target: "game"
                  event: "error"
                  message: "Game not found"