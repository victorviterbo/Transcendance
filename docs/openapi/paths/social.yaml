friends-list:
  get:
    summary: List friends
    description: Return the accepted friends of the authenticated user.
    operationId: listFriends
    tags: [social]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Friend list.
        content:
          application/json:
            schema:
              type: object
              properties:
                friends:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/FriendInfo
            examples:
              friends-ok:
                value:
                  friends:
                    - uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "alice"
                      image: "path/to/image"
                      exp_points: 100
                      badges: "deaf octopus"
                      created_at: "2026-04-26T10:33:49.316Z"
                      status: "online"


friends-search:
  post:
    summary: Search for users
    description: Called when user wants to find a user. 
    operationId: searchFriends
    tags: [social]
    security:
      - bearerAuth: []
    requestBody:
      description: "User search filter"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              search: { type: string }
          examples:
            list:
              value:
                search: "ali"

    responses:
      "200":
        description: "Returns found users lists"
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/ExtUserInfo
            examples:
              ok:
                value:
                  users:
                    - uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "alice"
                      image: "path/to/image"
                      badges: "deaf octopus"
                      relation: "not-friends"


friends-requests:
  get:
    summary: List requests
    description: Return the list of all incoming and outgoing requests
    operationId: listFriendsRequests
    tags: [social]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Two lists are send back one for all incoming and the other for all outgoing
        content:
          application/json:
            schema:
              type: object
              properties:
                incoming:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/ExtUserInfo
                outgoing:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/ExtUserInfo
            examples:
              ok:
                value:
                  incoming:
                    - uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "alice"
                      image: "path/to/image"
                      badges: "deaf octopus"
                      relation: "incoming"
                  outgoing:
                    - uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "john"
                      image: "path/to/image"
                      badges: "deaf octopus"
                      relation: "outgoing"

friends-requests-send:
  post:
    summary: Send a friend requests to another user 
    description: Called when user wants to ask  another user for friendship. 
    operationId: addFriends
    tags: [social]
    security:
      - bearerAuth: []
    requestBody:
      description: "Targeted user"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              target-username: { type: string }
              target-uid: {type: string}
          examples:
            list:
              value:
                target-username: "alice"
                target-uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"

                
friends-requests-respond:
  post:
    summary: Send a response
    description: Called when user wants to reponse to a frienship requests
    operationId: responseFriends
    tags: [social]
    security:
      - bearerAuth: []
    requestBody:
      description: "Targeted user & response value"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              target-username: { type: string }
              target-uid: {type: string}
              new-status: {type: string, format: "accept | refuse"}
          examples:
            list:
              value:
                target-username: "alice"
                target-uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                new-status: "refuse"

                

social-message:
  post:
    summary: Requests the feed history 
    description: Requests the feed history with a specified friend. 
    operationId: socialMessages
    tags: [social]
    security:
      - bearerAuth: []
    requestBody:
      description: "Targeted user"
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              username: { type: string }
              uid: {type: string}
          examples:
            list:
              value:
                username: "alice"
                uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
    responses:
      "200":
        description: Message feed
        content:
          application/json:
            schema:
              type: object
              properties:
                feed:
                  type: array
                  items:
                    $ref: ../openapi.yaml#/components/schemas/Message
            examples:
              friends-ok:
                value:
                  feed:
                    - message: "Hey !!!"
                      date: "2026-04-26T10:33:49.316Z"
                      direction: "outgoing"
                      status: "read"
                      target-id: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      target: "alice"
                      uid: "57092788-491a-484c-a162-b67657584fa5"


notif:
  get:
    summary: List all notifications
    description: Return the lists of all the users notifications
    operationId: listNotif
    tags: [social]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Notif list.
        content:
          application/json:
            schema:
              type: object
              properties:
                notifs:
                  type: array
                  items:
                    oneOf:
                      - $ref: ../openapi.yaml#/components/schemas/Notif - Requests
                      - $ref: ../openapi.yaml#/components/schemas/Notif - Accepted
            examples:
              ok:
                value:
                  notifs:
                  - uid: "57092788-491a-484c-a162-b67657584fa5"
                    kind: "friend-request"
                    from:
                      uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "alice"
                      image: "path/to/image"
                      badges: "deaf octopus"
                      relation: "incoming"
                    date: 2026-04-26T10:33:49.316Z"
                    read: false;
                  - uid: "57092788-491a-484c-a162-b67657584fa5"
                    kind: "friend-accepted"
                    from:
                      uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                      username: "john"
                      image: "path/to/image"
                      exp_points: 100
                      badges: "deaf octopus"
                      created_at: "2026-04-26T10:33:49.316Z"
                      status: "online"
                    date: 2026-04-26T10:33:49.316Z"
                    read: true;

notif-read:
  get:
    summary: Event when user reads notif
    description: Event to trigger to indicated the backend the user have read (open) it's notifictions
    operationId: notifRead
    tags: [social]
    security:
      - bearerAuth: []