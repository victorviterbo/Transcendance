      type: object
      required: [target, event, uid, self]
      properties:
        target: { const: game }
        event: { const: game_closed }
        uid: { type: string, format: uuid }
        self: { $ref: "#/components/schemas/PlayerInfo" }

    GameErrorPayload:
      type: object
      description: Game errors are not normalized to a finite code set by the backend.
      required: [target, event, message]
      properties:
        target: { const: game }
        event: { const: error }
        uid:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
          description: Game UID when the error is associated with a game; null for context-free errors.
        self: { $ref: "#/components/schemas/PlayerInfo" }
        message: { type: string }
        currentGameUid:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
          description: Active game UID for ALREADY_IN_GAME errors; otherwise null.
        critical: { type: boolean }
        error:
          type: object
          additionalProperties: true

    GameAlreadyInGameErrorPayload:
      type: object
      required: [target, event, uid, self, message, currentGameUid]
      properties:
        target:
          const: game
        event:
          const: error
        uid:
          type: string
          format: uuid
          description: Game UID.
        self:
          $ref: "#/components/schemas/PlayerInfo"
        message:
          const: ALREADY_IN_GAME
        currentGameUid:
          type: string
          format: uuid
          description: Game UID the player is already in.

    GameFullErrorPayload:
      type: object
      required: [target, event, uid, self, message]
      properties:
        target:
          const: game
        event:
          const: error
        uid:
          type: string
          format: uuid
          description: Game UID.
        self:
          $ref: "#/components/schemas/PlayerInfo"
        message:
          const: GAME_FULL
