openapi: 3.0.3
info:
  title: ft_transcendence API
  version: 1.0.0
  description: HTTP API implemented by the current Django backend.
  contact:
    name: ft_transcendence Team
    email: support@example.com
servers:
  - url: https://localhost:4443

paths:
  /api/health/:
    get:
      summary: Health check
      description: Return a simple backend health status.
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  /api/auth/register/:
    $ref: ./paths/auth.yaml#/register
  /api/auth/login/:
    $ref: ./paths/auth.yaml#/login
  /api/auth/refresh/:
    $ref: ./paths/auth.yaml#/refresh
  /api/auth/logout/:
    $ref: ./paths/auth.yaml#/logout
  /api/auth/password/:
    $ref: ./paths/auth.yaml#/password
  /api/auth/delete/:
    $ref: ./paths/auth.yaml#/delete
  /api/social/friends/:
    $ref: ./paths/social.yaml#/friends-list
  /api/social/friends-search/:
    $ref: ./paths/social.yaml#/friends-search
  /api/social/friends-request/:
    $ref: ./paths/social.yaml#/friends-requests
  /api/social/friend-request/send/:
    $ref: ./paths/social.yaml#/friends-requests-send
  /api/social/friend-request/respond/:
    $ref: ./paths/social.yaml#/friends-requests-respond
  /api/social/friend/remove/:
    $ref: ./paths/social.yaml#/friend-remove
  /api/social/message/:
    $ref: ./paths/social.yaml#/social-message
  /api/social/notifs/:
    $ref: ./paths/social.yaml#/notif
  /api/social/notifs/read/:
    $ref: ./paths/social.yaml#/notif-read
  /api/profile/:
    $ref: ./paths/profile.yaml#/profile
  /api/profile/search/:
    $ref: ./paths/profile.yaml#/search
  /api/profile/guest-create/:
    $ref: ./paths/profile.yaml#/guest-create
  /api/profile/guest-delete/:
    $ref: ./paths/profile.yaml#/guest-delete
  /api/stats/global/:
    $ref: ./paths/stats.yaml#/global
  /api/stats/leaderboard/:
    $ref: ./paths/stats.yaml#/leaderboard
  /api/stats/history/:
    $ref: ./paths/stats.yaml#/history
  /api/game/friends/:
    $ref: ./paths/game.yaml#/game-friends-list
  /api/game/:
    $ref: ./paths/game.yaml#/game
  /api/game/{uid}/:
    $ref: ./paths/game.yaml#/game-common

components:
  schemas:
    Profile:
      $ref: ./components/schemas.yaml#/Profile
    OwnProfile:
      $ref: ./components/schemas.yaml#/OwnProfile
    LightProfile:
      $ref: ./components/schemas.yaml#/LightProfile
    ValidationError:
      $ref: ./components/schemas.yaml#/ValidationError
    AuthError:
      $ref: ./components/schemas.yaml#/AuthError
    ConflictError:
      $ref: ./components/schemas.yaml#/ConflictError
    TokenResponse:
      $ref: ./components/schemas.yaml#/TokenResponse
    PasswordChangeResponse:
      $ref: ./components/schemas.yaml#/PasswordChangeResponse
    DescriptionResponse:
      $ref: ./components/schemas.yaml#/DescriptionResponse
    SerializerErrorResponse:
      $ref: ./components/schemas.yaml#/SerializerErrorResponse
    ProfileDeleteRequest:
      $ref: ./components/schemas.yaml#/ProfileDeleteRequest
    ProfilePasswordChangeRequest:
      $ref: ./components/schemas.yaml#/ProfilePasswordChangeRequest
    GlobalStatsResponse:
      $ref: ./components/schemas.yaml#/GlobalStatsResponse
    LeaderboardResponse:
      $ref: ./components/schemas.yaml#/LeaderboardResponse
    HistoryResponse:
      $ref: ./components/schemas.yaml#/HistoryResponse
    ExtUserInfo:
      $ref: ./components/schemas_users.yaml#/ExtUserInfo
    FriendInfo:
      $ref: ./components/schemas_social.yaml#/FriendInfo
    Message:
      $ref: ./components/schemas_social.yaml#/Message
    FriendTargetRequest:
      $ref: ./components/schemas_social.yaml#/FriendTargetRequest
    FriendActionResponse:
      $ref: ./components/schemas_social.yaml#/FriendActionResponse
    NotifRequests:
      $ref: ./components/schemas_social.yaml#/NotifRequests
    NotifAccepted:
      $ref: ./components/schemas_social.yaml#/NotifAccepted
    GameDetail:
      $ref: ./components/schemas_game.yaml#/GameDetail
    GameListResponse:
      $ref: ./components/schemas_game.yaml#/GameListResponse
    GameCreationRequest:
      $ref: ./components/schemas_game.yaml#/GameCreationRequest

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: health
    description: Backend status endpoint.
  - name: auth
    description: Authentication and registration endpoints.
  - name: social
    description: Friend list and friend request endpoints.
  - name: profile
    description: User profile and account management endpoints.
  - name: stats
    description: User statistics
  - name: game
    description: "All game related endpoints"
