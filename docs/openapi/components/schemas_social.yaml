FriendInfo:
  type: object
  required: [uid, username, avatar, exp_points, badges, created_at, status]
  properties:
    uid: { type: string, format: uuid }
    username: { type: string }
    avatar: { type: string, format: uri-reference }
    exp_points: { type: integer }
    badges: { type: string }
    created_at: { type: string, format: date-time }
    status: { type: string, enum: [offline, online] }

Message:
  type: object
  required: [message, date, direction, targetUid, target, uid]
  properties:
    message: { type: string, maxLength: 500 }
    date: { type: string, format: date-time }
    direction: { type: string, enum: [outgoing, incoming] }
    status:
      type: string
      enum: [sent, recieved, read]
      description: Present only on outgoing messages; `recieved` is the implemented spelling.
    targetUid: { type: string, format: uuid }
    target: { type: string, description: Other participant's username. }
    uid: { type: string, format: uuid }

FriendTargetRequest:
  type: object
  required: [targetUid]
  properties:
    targetUid: { type: string, format: uuid }
    targetUsername:
      type: string
      description: Optional display value echoed in the response; identity is resolved by UID.

FriendActionResponse:
  type: object
  required: [description, targetUid, targetUsername]
  properties:
    description:
      type: string
      enum:
        - FRIENDSHIP_REQUEST_SENT
        - FRIENDSHIP_REQUEST_ACCEPTED
        - FRIENDSHIP_REQUEST_REJECTED
        - FRIENDSHIP_REQUEST_CANCELLED
        - FRIENDSHIP_REMOVED
    targetUid: { type: string, format: uuid }
    targetUsername: { type: string }

NotifRequests:
  type: object
  required: [uid, kind, from, date, read]
  properties:
    uid: { type: string, format: uuid }
    kind: { type: string, enum: [friend_request] }
    from: { $ref: ../openapi.yaml#/components/schemas/ExtUserInfo }
    date: { type: string, format: date-time }
    read: { type: boolean }

NotifAccepted:
  type: object
  required: [uid, kind, from, date, read]
  properties:
    uid: { type: string, format: uuid }
    kind: { type: string, enum: [friend_accepted] }
    from: { $ref: ../openapi.yaml#/components/schemas/ExtUserInfo }
    date: { type: string, format: date-time }
    read: { type: boolean }
