game-common:
  parameters:
    - name: ROOMID
      in: path
      required: true
      schema:
        type: string
  get:
    summary: All info about current game
    description: Return all data about the current status of the game
    operationId: getGame
    tags: [game]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: All game data
        content:
          application/json:
            schema:
