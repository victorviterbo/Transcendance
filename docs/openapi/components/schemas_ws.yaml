#SERVER TO CLIENT
WS-StoC-FriendChat:
  type: object
  description: Websocket object for recieved data from the server about all friend chats requests
  properties:
    target: { type: string, fromat: "friend-chat"}
    event: 
      type: string
      fromat: "update_status | new"
      descripion: "update_status: change the current status of the target message (targeted by uid) | new: Notif client there is a new message inbond"
    message:
      $ref: ../openapi.yaml#/components/schemas/Message

WS-StoC-Notif:
  type: object
  description: Websocket object for recieved data from the server about all notifications requests
  properties:
    target: { type: string, fromat: "notif"}
    event: 
      type: string
      fromat: "new"
      descripion: "new: Notif client there is a new notification inbond"
    notif:
      oneOf:
       - $ref: ../openapi.yaml#/components/schemas/Notif - Requests
       - $ref: ../openapi.yaml#/components/schemas/Notif - Accepted

WS-StoC-FriendRequests:
  type: object
  description: Websocket object for recieved data from the server about all friend requests (used for live update)
  properties:
    target: { type: string, fromat: "friend-request"}
    event: 
      type: string
      fromat: "new-incoming"
      descripion: "new-incoming: Client recieved a new friend requests"
    user:
      $ref: ../openapi.yaml#/components/schemas/ExtUserInfo

      

WS-StoC-Game:
  type: object
  description: Websocket payloads sent by the server for game flow.
  properties:
    target:
      type: string
      enum: [game]
    event:
      type: string
      enum:
        - joined_game
        - game_started
        - answer_correct
        - answer_incorrect
        - left_game
        - player_joined
        - player_answered
        - player_left
        - round_started
        - track_revealed
        - round_end
        - round_advanced
        - game_completed
        - error
    game_uid:
      type: string
      description: Current game identifier.
    player_uid:
      type: string
      description: Player identifier used in membership and broadcast events.
    player_name:
      type: string
      description: Player display name used in broadcasts.
    started_by:
      type: string
      description: Username of the player who started the game.
    round_number:
      type: integer
      description: Current round number.
    message:
      type: string
      description: Error message or status text.
    track:
      type: object
      description: Serialized music track payload.
      properties:
        itunes_id:
          type: integer
        title:
          type: string
        artist:
          type: string
        genre:
          type: string
        preview_url:
          type: string
          nullable: true
        artwork_url:
          type: string
          nullable: true
    results:
      type: object
      description: Round results broadcast at the end of a round.
      properties:
        correct_answer:
          type: object
          properties:
            artist:
              type: string
            song:
              type: string
        answers:
          type: array
          items:
            type: object
            properties:
              player_uid:
                type: string
              player_name:
                type: string
              answer:
                type: string
              is_correct:
                type: boolean



#CLIENT TO SERVER
WS-CtoS-FriendChat:
  type: object
  description: Websocket object for send data to the server about all friend chats requests
  properties:
    target: { type: string, fromat: "friend-chat"}
    event: 
      type: string
      fromat: "send | open | close"
      descripion: "send: notify server there is a message sent by user |\
        open: Notify server a chat has been opened with targeted user |\
        close: Notify server a chat hjas been closed with targeted user"
    message (send):
      $ref: /components/schemas_social.yaml#/Message
    to (open | close):
      type: string
      descripion: "Name of the target user"
    toUid (open | close):
      type: string
      descripion: "uid of the target user0"

WS-CtoS-Game:
  type: object
  description: Websocket payloads sent by the client to control a game session.
  properties:
    target:
      type: string
      enum: [game]
    event:
      type: string
      enum:
        - join_game
        - start_game
        - answer_submit
        - leave_game
    game_uid:
      type: string
      description: Current game identifier required by all game websocket actions.
    answer:
      type: string
      description: Player answer submitted during a round.
    answerTime:
      type: number
      format: float
      description: Time taken by the player to answer.