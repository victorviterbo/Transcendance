game-common:
  get:
    summary: All info about current game
    description: Return all data about the current status of the game
    operationId: getGame
    tags: [game]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: All game data
        content:
          application/json:
            schema:
              type: object
              properties:
                game:
                  $ref: ../openapi.yaml#/components/schemas/Game - GameData
            examples:
              ok:
                value:
                  game:
                    players:
                      - user: 
                          uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                          username: "alice"
                          image: "path/to/image"
                          badges: "deaf octopus"
                          relation: "incoming"
                        points: 150
                      - user: 
                          uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                          username: "john"
                          image: "path/to/image"
                          badges: "deaf octopus"
                          relation: "self"
                        points: 50
                    maxPlayers: 100
                    id: "123456"
    patch:
      summary: Partially update a game
      description: Update mutable fields of a game (e.g., `public_level`)
      operationId: patchGame
      tags: [game]
      security:
        - bearerAuth: []
      parameters:
        - name: ROOMID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_level:
                  type: string
                  description: New privacy level (public/friends_only/invite_only)
      responses:
        "200":
          description: Game updated
          content:
            application/json:
              schema:
                $ref: ../openapi.yaml#/components/schemas/GameCreationResponse
    delete:
      summary: Delete a game
      description: Remove a game resource
      operationId: deleteGame
      tags: [game]
      security:
        - bearerAuth: []
      parameters:
        - name: ROOMID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Game deleted

  game-list:
    get:
      summary: List games
      description: Return a list of games (brief info)
      operationId: listGames
      tags: [game]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../openapi.yaml#/components/schemas/GameCreationResponse

