game-common:
  get:
    summary: All info about current game
    description: Return all data about the current status of the game
    operationId: getGame
    tags: [game]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: All game data
        content:
          application/json:
            schema:
              type: object
              properties:
                game:
                  $ref: ../openapi.yaml#/components/schemas/Game - GameData
            examples:
              ok:
                value:
                  game:
                    players:
                      - user: 
                          uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                          username: "alice"
                          image: "path/to/image"
                          badges: "deaf octopus"
                          relation: "incoming"
                        points: 150
                      - user: 
                          uid: "a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44"
                          username: "john"
                          image: "path/to/image"
                          badges: "deaf octopus"
                          relation: "self"
                        points: 50
                    maxPlayers: 100
                    id: "123456"

