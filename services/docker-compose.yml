services:
  backend:
    container_name: backend
    image: transcendence-backend
    build:
      context: .
      dockerfile: backend/build/Dockerfile
    volumes:
      - backend-database:/data/database
      - backend-media:/data/media
    expose:
      - "8000"
    env_file: ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    container_name: nginx
    image: transcendence-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend-media:/data/media:ro
    depends_on:
      - backend

volumes:
  backend-database:
  backend-media:
