GameProfile:
  type: object
  required: [username, avatar, guest, uid]
  properties:
    username: { type: string }
    avatar: { type: string, format: uri-reference, nullable: true }
    guest: { type: boolean }
    uid: { type: string, format: uuid }

GameDetail:
  type: object
  required: [uid, name, genres, players]
  properties:
    uid: { type: string, format: uuid }
    name: { type: string, minLength: 1, maxLength: 40 }
    genres:
      type: array
      items:
        type: string
        enum: [TAG_POP, TAG_RAP, TAG_ROCK, TAG_ELECTRO, TAG_FRENCH_VARIETY, TAG_RNB]
    players:
      description: Active players currently present in the room. Inactive or disconnected players are omitted.
      type: array
      items: { $ref: "#/GameProfile" }

GameListResponse:
  type: object
  required: [rooms]
  properties:
    rooms:
      type: array
      items: { $ref: "#/GameDetail" }

GameCreationRequest:
  type: object
  required: [name, visibility]
  properties:
    name: { type: string, minLength: 1, maxLength: 40 }
    visibility: { type: string, enum: [public, private, friends] }
