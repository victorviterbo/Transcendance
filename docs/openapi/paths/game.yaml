    description: Return a list of games (brief info)
    operationId: listGames
    tags: [game]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of games
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/GameCreationResponse

  post:
    summary: Create a new game
    description: Create a new game (with only name and privacy required) with specified settings, genres, and tracks
    operationId: createGame
    tags: [game]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/GameCreationRequest
          examples:
            basic:
              summary: Basic game creation
              value:
                game_name: "My Game"
