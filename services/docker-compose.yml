services:
  backend:
    container_name: backend
    image: transcendence-backend
    build:
      context: .
      dockerfile: backend/build/Dockerfile
    volumes:
      - backend-database:/data/database
      - backend-media:/data/media
    expose:
      - "8000"
    env_file: ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "/opt/conda/envs/backend/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    container_name: nginx
    image: transcendence-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend-media:/data/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-database:
  backend-media:
