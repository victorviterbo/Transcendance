asyncapi: 3.1.0
id: urn:ft-transcendence:websocket:global
info:
  title: ft_transcendence Global WebSocket API
  version: 2.0.0
  description: |
    Realtime messages exchanged through the global WebSocket connection.
    This document covers the implemented friend chat, friend request,
    notification, and game lifecycle payloads. The client reconnects after
    ordinary connection loss and after browser history/BFCache navigation.
defaultContentType: application/json
channels:
  globalSocket:
    address: /ws/global/
    title: Global realtime connection
    messages:
      friend_chat_send:
        $ref: "#/components/messages/FriendChatSend"
      friend_chat_open:
        $ref: "#/components/messages/FriendChatOpen"
      friend_chat_close:
        $ref: "#/components/messages/FriendChatClose"
      friend_chat_new:
        $ref: "#/components/messages/FriendChatNew"
      friend_chat_update_status:
        $ref: "#/components/messages/FriendChatStatusUpdated"
      friend_request_new_incoming:
        $ref: "#/components/messages/FriendRequestIncoming"
      notif_new:
        $ref: "#/components/messages/NotificationNew"
      command_error:
        $ref: "#/components/messages/CommandError"
      player_join:
        $ref: "#/components/messages/GameJoin"
      game_start:
        $ref: "#/components/messages/GameStart"
      settings_update:
        $ref: "#/components/messages/GameUpdateSettings"
      answer_submit:
        $ref: "#/components/messages/GameSubmitAnswer"
      message_send:
        $ref: "#/components/messages/GameMessageSend"
      player_leave:
        $ref: "#/components/messages/GameLeave"
      game_restart:
        $ref: "#/components/messages/GameRestart"
      player_joined:
        $ref: "#/components/messages/GamePlayerJoined"
      game_info:
        $ref: "#/components/messages/GameInfo"
      settings_updated:
        $ref: "#/components/messages/GameSettingsUpdated"
      game_started:
        $ref: "#/components/messages/GameStartSignal"
      round_preview:
        $ref: "#/components/messages/GameRoundPreview"
      round_started:
        $ref: "#/components/messages/GameRoundStarted"
      answer_validation:
        $ref: "#/components/messages/GameAnswerValidation"
      answer_broadcast:
        $ref: "#/components/messages/GameAnswerBroadcast"
      message_history:
        $ref: "#/components/messages/GameMessageHistory"
      message_broadcast:
        $ref: "#/components/messages/GameMessageBroadcast"
      round_ended:
        $ref: "#/components/messages/GameRoundEnd"
      player_left:
        $ref: "#/components/messages/GamePlayerLeft"
      new_owner:
        $ref: "#/components/messages/GameNewOwner"
      game_ended:
        $ref: "#/components/messages/GameEnded"
      game_restarted:
        $ref: "#/components/messages/GameRestarted"
      game_closed:
        $ref: "#/components/messages/GameClosed"
      error:
        $ref: "#/components/messages/GameError"

operations:
  SOCIAL_RECEIVE:
    action: receive
    title: SOCIAL_RECEIVE
    summary: Messages the backend receives from the frontend for social features.
    channel:
      $ref: "#/channels/globalSocket"
    messages:
      - $ref: "#/channels/globalSocket/messages/friend_chat_send"
      - $ref: "#/channels/globalSocket/messages/friend_chat_open"
      - $ref: "#/channels/globalSocket/messages/friend_chat_close"

  SOCIAL_SEND:
    action: send
    title: SOCIAL_SEND
    summary: Messages the backend sends to the frontend for social features.
    channel:
      $ref: "#/channels/globalSocket"
    messages:
      - $ref: "#/channels/globalSocket/messages/friend_chat_new"
      - $ref: "#/channels/globalSocket/messages/friend_chat_update_status"
      - $ref: "#/channels/globalSocket/messages/friend_request_new_incoming"
      - $ref: "#/channels/globalSocket/messages/notif_new"
      - $ref: "#/channels/globalSocket/messages/command_error"

  GAME_RECEIVE:
    action: receive
    title: GAME_RECEIVE
    summary: Messages the backend receives from a frontend participating in a game.
    channel:
      $ref: "#/channels/globalSocket"
    messages:
      - $ref: "#/channels/globalSocket/messages/player_join"
      - $ref: "#/channels/globalSocket/messages/game_start"
      - $ref: "#/channels/globalSocket/messages/settings_update"
      - $ref: "#/channels/globalSocket/messages/answer_submit"
      - $ref: "#/channels/globalSocket/messages/message_send"
      - $ref: "#/channels/globalSocket/messages/player_leave"
      - $ref: "#/channels/globalSocket/messages/game_restart"

  GAME_SEND:
    action: send
    title: GAME_SEND
    summary: Messages the backend sends to one player or broadcasts to players in a game.
    channel:
      $ref: "#/channels/globalSocket"
    messages:
      - $ref: "#/channels/globalSocket/messages/player_joined"
      - $ref: "#/channels/globalSocket/messages/game_info"
      - $ref: "#/channels/globalSocket/messages/settings_updated"
      - $ref: "#/channels/globalSocket/messages/game_started"
      - $ref: "#/channels/globalSocket/messages/round_preview"
      - $ref: "#/channels/globalSocket/messages/round_started"
      - $ref: "#/channels/globalSocket/messages/answer_validation"
      - $ref: "#/channels/globalSocket/messages/answer_broadcast"
      - $ref: "#/channels/globalSocket/messages/message_history"
      - $ref: "#/channels/globalSocket/messages/message_broadcast"
      - $ref: "#/channels/globalSocket/messages/round_ended"
      - $ref: "#/channels/globalSocket/messages/player_left"
      - $ref: "#/channels/globalSocket/messages/new_owner"
      - $ref: "#/channels/globalSocket/messages/game_ended"
      - $ref: "#/channels/globalSocket/messages/game_restarted"
      - $ref: "#/channels/globalSocket/messages/game_closed"
      - $ref: "#/channels/globalSocket/messages/error"

components:
  messages:
    FriendChatSend:
      name: friend_chat.send
      title: friend_chat - Send a private friend message
      summary: Frontend command to persist and deliver a private message.
      payload:
        $ref: "#/components/schemas/FriendChatSendPayload"
      examples:
        - name: sendMessage
          payload:
            target: friend_chat
            event: send
            message:
              message: Hey, are you ready?
              date: "2026-04-26T10:33:49.316Z"
              direction: outgoing
              status: not-sent
              targetUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
              target: alice
              uid: TEMP_ID

    FriendChatOpen:
      name: friend_chat.open
      title: friend_chat - Open a friend conversation
      summary: Frontend command used by the backend to track read-state delivery.
      payload:
        $ref: "#/components/schemas/FriendChatOpenPayload"
      examples:
        - name: openChat
          payload:
            target: friend_chat
            event: open
            to: alice
            toUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44

    FriendChatClose:
      name: friend_chat.close
      title: friend_chat - Close a friend conversation
      summary: Frontend command clearing backend tracking for an open conversation.
      payload:
        $ref: "#/components/schemas/FriendChatClosePayload"
      examples:
        - name: closeChat
          payload:
            target: friend_chat
            event: close
            to: alice
            toUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44

    FriendChatNew:
      name: friend_chat.new
      title: friend_chat - New friend chat message
      summary: Server delivery of a newly persisted private message.
      payload:
        $ref: "#/components/schemas/FriendChatNewPayload"
      examples:
        - name: outgoingConfirmation
          payload:
            target: friend_chat
            event: new
            message:
              message: Hey, are you ready?
              date: "2026-04-26T10:33:49.316Z"
              direction: outgoing
              status: sent
              targetUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
              target: alice
              uid: 57092788-491a-484c-a162-b67657584fa5
        - name: incomingMessage
          payload:
            target: friend_chat
            event: new
            message:
              message: Yes.
              date: "2026-04-26T10:34:02.101Z"
              direction: incoming
              targetUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
              target: alice
              uid: 831a10b5-91c5-464d-a27d-a76246a9d21f

    FriendChatStatusUpdated:
      name: friend_chat.update_status
      title: friend_chat - Friend message status updated
      summary: Server update for an already known outgoing message.
      payload:
        $ref: "#/components/schemas/FriendChatStatusUpdatedPayload"
      examples:
        - name: messageRead
          payload:
            target: friend_chat
            event: update_status
            message:
              message: Hey, are you ready?
              date: "2026-04-26T10:33:49.316Z"
              direction: outgoing
              status: read
              targetUid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
              target: alice
              uid: 57092788-491a-484c-a162-b67657584fa5
        - name: deliveredAfterReconnect
          payload:
            target: friend_chat
            event: update_status
            message:
              uid: 57092788-491a-484c-a162-b67657584fa5
              status: recieved

    FriendRequestIncoming:
      name: friend_request.new_incoming
      title: friend_request - Incoming friend request
      summary: Server update used to append an entry to the incoming request list.
      payload:
        $ref: "#/components/schemas/FriendRequestIncomingPayload"
      examples:
        - name: aliceRequestsFriendship
          payload:
            target: friend_request
            event: new_incoming
            user:
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              badges: curious
              relation: incoming

    NotificationNew:
      name: notif.new
      title: notif - New social notification
      summary: Server push for either a pending request or an accepted request.
      payload:
        $ref: "#/components/schemas/NotificationNewPayload"
      x-contract-note: |
        The backend currently serializes `from` as ExternalUser for both
        notification kinds. The frontend TypeScript type declares FriendInfo
        for `friend_accepted`, while its renderer only consumes fields present
        in ExternalUser. This schema reflects the backend wire payload.
      examples:
        - name: incomingRequestNotification
          payload:
            target: notif
            event: new
            notif:
              uid: 57092788-491a-484c-a162-b67657584fa5
              kind: friend_request
              from:
                uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
                username: alice
                avatar: /static/default_avatars/default_avatar_1.png
                badges: curious
                relation: incoming
              date: "2026-04-26T10:33:49.316Z"
              read: false
        - name: acceptedRequestNotification
          payload:
            target: notif
            event: new
            notif:
              uid: 57092788-491a-484c-a162-b67657584fa5
              kind: friend_accepted
              from:
                uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
                username: alice
                avatar: /static/default_avatars/default_avatar_1.png
                badges: curious
                relation: friends
              date: "2026-04-26T10:33:49.316Z"
              read: false

    CommandError:
      name: command.error
      title: Non-game command error
      summary: Validation/routing error emitted by friend-chat handlers.
      payload:
        $ref: "#/components/schemas/CommandErrorPayload"

    GameJoin:
      name: game.player_join
      title: game - Join a game
      payload:
        $ref: "#/components/schemas/GameJoinPayload"
      examples:
        - name: joinGame
          payload:
            target: game
            event: player_join
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd

    GameStart:
      name: game.game_start
      title: game - Start a game
      payload:
        $ref: "#/components/schemas/GameStartPayload"
      examples:
        - name: startGame
          payload:
            target: game
            event: game_start
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd

    GameRestart:
      name: game.game_restart
      title: game - Restart a finished game
      payload:
        $ref: "#/components/schemas/GameRestartPayload"

    GameUpdateSettings:
      name: game.settings_update
      title: game - Update game settings
      payload:
        $ref: "#/components/schemas/GameUpdateSettingsPayload"
      examples:
        - name: updateSettings
          payload:
            target: game
            event: settings_update
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            settings:
              genres: [TAG_POP, TAG_ROCK]
              mode: speed
              trackCount: 5
              playbackDuration: 10
              breakDuration: 5
              reveal: true
              fuzzy: true

    GameSubmitAnswer:
      name: game.answer_submit
      title: game - Submit an answer
      payload:
        $ref: "#/components/schemas/GameSubmitAnswerPayload"
      examples:
        - name: submitAnswer
          payload:
            target: game
            event: answer_submit
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            answer: Artist name
            time: 2.4

    GameMessageSend:
      name: game.message_send
      title: game - Send chat message
      summary: Frontend command to send a chat message to the current game.
      payload:
        $ref: "#/components/schemas/GameMessageSendPayload"
      examples:
        - name: sendGameMessage
          payload:
            target: game
            event: message_send
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            message: Good luck everyone!

    GameLeave:
      name: game.player_leave
      title: game - Leave a game
      payload:
        $ref: "#/components/schemas/GameLeavePayload"
      examples:
        - name: leaveGame
          payload:
            target: game
            event: player_leave
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd

    GamePlayerJoined:
      name: game.player_joined
      title: game - Player joined the game
      summary: Broadcast after joining; also used by two exceptional backend paths.
      payload:
        $ref: "#/components/schemas/GamePlayerJoinedPayload"
      examples:
        - name: playerJoined
          payload:
            target: game
            event: player_joined
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            player:
              username: bob
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: 831a10b5-91c-464d-a27d-a76246a9d21f
    GameInfo:
      name: game.game_info
      title: game - Joined game information
      summary: Direct message sent to a player after joining, containing the current game information.
      payload:
        $ref: "#/components/schemas/GameInfoPayload"
      examples:
        - name: currentGameInfo
          payload:
            target: game
            event: game_info
            uid: a6592217-2ffe-47f8-8440-40b3eb043c38
            self:
              username: ws_owner
              avatar: /static/default_avatars/default_avatar_9.png
              guest: false
              uid: cda01f95-85a2-4b5b-8892-7f9ea71309da
            game:
              uid: a6592217-2ffe-47f8-8440-40b3eb043c38
              name: WS Full Lifecycle
              owner:
                username: ws_owner
                avatar: /static/default_avatars/default_avatar_9.png
                guest: false
                uid: cda01f95-85a2-4b5b-8892-7f9ea71309da
              status: playing_break
              round: 3
              genres: [TAG_ROCK]
              visibility: public
              maxPlayers: 16
            settings:
              genres: [TAG_ROCK]
              mode: speed
              trackCount: 5
              playbackDuration: 10.0
              breakDuration: 5.0
              reveal: true
              fuzzy: true
            leaderboard:
              - player:
                  username: ws_owner
                  avatar: /static/default_avatars/default_avatar_9.png
                  guest: false
                  uid: cda01f95-85a2-4b5b-8892-7f9ea71309da
                points: 42
              - player:
                  username: alice
                  avatar: /static/default_avatars/default_avatar_1.png
                  guest: false
                  uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
                points: 35
              - player:
                  username: bob
                  avatar: /static/default_avatars/default_avatar_2.png
                  guest: false
                  uid: 831a10b5-91c-464d-a27d-a76246a9d21f
                points: 27
              - player:
                  username: guest_player
                  avatar: /static/default_avatars/default_avatar_3.png
                  guest: true
                  uid: 71f43851-df63-489f-9a80-b14d5c0c4f15
                points: 12
            history:
              - track:
                  title: Test Track 20
                  artist: Test Artist 20
                  preview: https://example.com/track.mp3
                  artwork: https://example.com/artwork.jpg
                titleFound: true
                artistFound: false
                time: 8.4
                ranking: 2
                points: 35
                round: 1
              - track:
                  title: Test Track 21
                  artist: Test Artist 21
                  preview: https://example.com/track-21.mp3
                  artwork: https://example.com/artwork-21.jpg
                titleFound: false
                artistFound: true
                time: 12.1
                ranking: 3
                points: 22
                round: 2
              - track:
                  title: Test Track 22
                  artist: Test Artist 22
                  preview: https://example.com/track-22.mp3
                  artwork: https://example.com/artwork-22.jpg
                titleFound: true
                artistFound: true
                time: 5.6
                ranking: 1
                points: 48
                round: 3

    GameSettingsUpdated:
      name: game.settings_updated
      title: game - Game settings updated
      payload:
        $ref: "#/components/schemas/GameSettingsUpdatedPayload"
      examples:
        - name: settingsUpdated
          payload:
            target: game
            event: settings_updated
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            settings:
              genres: [TAG_POP]
              mode: speed
              trackCount: 5
              playbackDuration: 10
              breakDuration: 5
              reveal: true
              fuzzy: true

    GameStartSignal:
      name: game.game_started
      title: game - Game countdown started
      payload:
        $ref: "#/components/schemas/GameStartSignalPayload"

    GameRoundStarted:
      name: game.round_started
      title: game - Round started
      payload:
        $ref: "#/components/schemas/GameRoundStartedPayload"
      examples:
        - name: roundStarted
          payload:
            target: game
            event: round_started
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            round: 3
            preview: https://example.com/track.mp3
            playbackDuration: 10

    GameRoundPreview:
      name: game.round_preview
      title: game - Round preview
      summary: Sent before the round starts so clients can cache the track preview.
      payload:
        $ref: "#/components/schemas/GameRoundPreviewPayload"
      examples:
        - name: roundPreview
          payload:
            target: game
            event: round_preview
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            round: 3
            preview: https://example.com/track.mp3
            playbackDuration: 10

    GameAnswerValidation:
      name: game.answer_validation
      title: game - Answer validation
      summary: Direct private response to the player who submitted an answer. A single submission may validate the title and artist together.
      payload:
        $ref: "#/components/schemas/GameAnswerValidationPayload"
      examples:
        - name: incorrectAnswer
          payload:
            target: game
            event: answer_validation
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            titleFound: false
            artistFound: false
            time: 2.4
        - name: titleFound
          payload:
            target: game
            event: answer_validation
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            titleFound: true
            artistFound: false
            time: 3.1
        - name: artistFound
          payload:
            target: game
            event: answer_validation
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            titleFound: false
            artistFound: true
            time: 4.6
        - name: titleAndArtistFound
          payload:
            target: game
            event: answer_validation
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            titleFound: true
            artistFound: true
            time: 5.2
            track:
              title: Test Track 20
              artist: Test Artist 20
              preview: https://example.com/track.mp3
              artwork: https://example.com/artwork.jpg

    GameAnswerBroadcast:
      name: game.answer_broadcast
      title: game - Answer broadcast
      summary: Broadcast when a guess should appear publicly in the game chat.
      payload:
        $ref: "#/components/schemas/GameAnswerBroadcastPayload"
      examples:
        - name: incorrectAnswerBroadcast
          payload:
            target: game
            event: answer_broadcast
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            player:
              username: bob
              avatar: /static/default_avatars/default_avatar_2.png
              guest: false
              uid: 831a10b5-91c-464d-a27d-a76246a9d21f
            kind: incorrect
            answer: Wrong guess
        - name: bothFoundBroadcast
          payload:
            target: game
            event: answer_broadcast
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            player:
              username: bob
              avatar: /static/default_avatars/default_avatar_2.png
              guest: false
              uid: 831a10b5-91c-464d-a27d-a76246a9d21f
            kind: bothFound

    GameMessageHistory:
      name: game.message_history
      title: game - Chat message history
      summary: Direct message containing existing game chat messages sorted by chronological chat appearance.
      payload:
        $ref: "#/components/schemas/GameMessageHistoryPayload"
      examples:
        - name: gameMessageHistory
          payload:
            target: game
            event: message_history
            uid: d76c7859-14ec-474d-814d-4b9ee5fdd2dd
            self:
              username: alice
              avatar: /static/default_avatars/default_avatar_1.png
              guest: false
              uid: a7e38b2d-3a0d-4b4f-a921-ba8e809bfd44
            messages:
              - uid: 2d0a0ab9-f633-4a5f-9c4e-a9f53120eafb
                sender:
                  username: bob
