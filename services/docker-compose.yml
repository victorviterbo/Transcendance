x-backend-environment: &backend-environment
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  PYTHONUNBUFFERED: "1"

x-backend-dependencies: &backend-dependencies
  redis:
    condition: service_healthy
  database:
    condition: service_healthy

x-celery-dependencies: &celery-dependencies
  redis:
    condition: service_healthy
  database:
    condition: service_healthy
  backend:
    condition: service_healthy

services:
  database:
    container_name: database
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: backend
    image: transcendence-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/build/Dockerfile
    volumes:
      - backend-media:/data/media
    expose:
      - "8000"
    environment: *backend-environment
    depends_on: *backend-dependencies
    healthcheck:
      test:
        [
          "CMD",
          "/opt/conda/envs/backend/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    container_name: celery-worker
    image: transcendence-backend
    restart: unless-stopped
    entrypoint: ["/opt/conda/envs/backend/bin/celery"]
    command: ["-A", "project", "worker", "--loglevel=info"]
    environment: *backend-environment
    depends_on: *celery-dependencies

  celery-beat:
    container_name: celery-beat
    image: transcendence-backend
    restart: unless-stopped
    entrypoint: ["/opt/conda/envs/backend/bin/celery"]
    command: ["-A", "project", "beat", "--loglevel=info"]
    environment: *backend-environment
    depends_on: *celery-dependencies

  nginx:
    container_name: nginx
    image: transcendence-nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        DEBUG: ${DEBUG}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend-media:/data/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database-data:
  backend-media:
