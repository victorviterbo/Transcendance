#FRIENDS
ExtUserInfo:
  type: object
  description: Minimal data about an external user (not friend)
  required: [uid, username, avatar, badges, relation]
  properties:
    uid: { type: string, format: uuid }
    username: { type: string }
    avatar:
      type: string
      format: uri-reference
      description: Usually a relative `/DB/media/...` path.
    badges: { type: string }
    relation:
      type: string
      enum: [not-friends, friends, incoming, outgoing]
